<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>第二版 · 草稿预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef2;color:#233e53;font:15px/1.5 "Microsoft YaHei",sans-serif}header{padding:14px 24px;background:#fff;border-bottom:1px solid #cbd7df;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}p{margin:3px 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}button,a.control{font:inherit;border:1px solid #b4c5d2;border-radius:4px;padding:8px 12px;background:#fff;color:#1b496e;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#1b496e;color:#fff}.status{padding:10px 24px;background:#f7f9fb;border-bottom:1px solid #d5dfe5;font-size:13px;color:#506677}.error{color:#a52424}main{padding:18px;display:flex;justify-content:center}iframe{border:1px solid #ccd7df;width:100%;height:calc(100dvh - 180px);min-height:400px;background:#fff;transition:width .15s;box-shadow:0 4px 18px #18354f12}#notice{color:#597080;font-size:13px}.pending{font-weight:600;color:#835d14}@media(max-width:600px){header{padding:12px;gap:10px}nav{margin-left:0}main{padding:8px}.status{padding:8px 12px}iframe{height:calc(100dvh - 245px)}}
</style></head><body>
<header><div><h1>第二版 · 草稿预览</h1><p id="notice">此处检查已保存资料的展示效果，正式网站不会随保存而修改。预览网址公开，请勿填写保密信息。</p></div><nav aria-label="预览工具"><button data-width="desktop" aria-pressed="true">电脑宽度</button><button data-width="mobile" aria-pressed="false">手机宽度</button><button id="refresh">更新预览</button><a class="control" href="https://app.pagescms.org/statfuture/hao-team/drafts/collection/v2_news" target="_blank" rel="noopener">返回草稿后台 ↗</a></nav></header>
<div class="status" role="status" aria-live="polite" id="status">正在检查草稿版本…</div><main><iframe title="网站真实排版预览" id="site" referrerpolicy="same-origin"></iframe></main>
<script>
(()=>{'use strict';
const frame=document.getElementById('site'),status=document.getElementById('status');let loadedSha='',busy=false;
function route(){const q=new URLSearchParams(location.search),path=q.get('path')||'';if(q.has('route')&&/^#\/(home|lab|news|team|research|resources|admissions)(\/|$|\?)/.test(q.get('route')))return q.get('route');const id=encodeURIComponent(path.split('/').pop().replace(/\.json$/,''));if(path.includes('/members/'))return '#/team/member/'+id;if(path.includes('/news/'))return '#/news/news/'+id;if(path.includes('/resources/'))return '#/resources/resources/'+id;if(path.includes('/directions/'))return '#/research';for(const kind of ['projects','papers','patents','books','awards'])if(path.includes('/'+kind+'/'))return '#/research/'+kind+'/team-'+id;if(path.endsWith('/lab.json'))return '#/lab';if(path.endsWith('/admissions.json'))return '#/admissions';return '#/home';}
function currentRoute(){try{return frame.contentWindow.location.hash||route()}catch{return route()}}
async function check(force=false){if(busy)return;busy=true;try{
 const response=await fetch('manifest.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('预览尚未生成');const m=await response.json();
 let latest='';try{const r=await fetch('https://api.github.com/repos/StatFuture/hao-team/branches/drafts',{cache:'no-store'});if(r.ok)latest=(await r.json()).commit.sha;}catch{}
 if(force||loadedSha!==m.draftSha){const hash=loadedSha?currentRoute():route();frame.src='site/?preview='+encodeURIComponent(m.draftSha)+hash;loadedSha=m.draftSha;}
 const time=new Date(m.builtAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});const pending=latest&&latest!==m.draftSha;status.className='status'+(pending?' pending':'');status.textContent=pending?'有已保存的修改尚未进入预览。请在后台左侧 Actions 点击“生成已保存草稿预览”；已点击则稍等，完成后这里会更新。':'预览生成时间：'+time+'。检查满意后，请回后台左侧 Actions 点“发布正式网站”（会发布全部已保存修改）。';
 }catch(e){status.className='status error';status.textContent='预览暂未加载成功，请稍后点“更新预览”。若后台生成失败，请查看操作结果；正式网站不受影响。';}finally{busy=false;}}
document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.style.width=b.dataset.width==='mobile'?'390px':'100%';}));document.getElementById('refresh').onclick=()=>check(true);check();setInterval(()=>{if(!document.hidden)check()},15000);
})();
</script></body></html>
