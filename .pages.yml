  - name: published
    label: 在网站显示
    type: boolean
    description: 只控制第二版团队资料的发布，不改变第一版。
  - name: order
    label: 排列序号
    type: number
    description: 数字越小越靠前；同序号的新闻按日期从新到旧排列。
    options:
      min: 0
  - name: researchArea
    label: 所属团队研究方向（与设置中的方向名称一致）
    type: string
  - name: contributors
    label: 参与成员或负责人
    type: string
  exclude:
  - .gitkeep
