media:
- name: images
  label: 图片
  input: media/images
  output: media/images
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  rename: safe
- name: files
  label: 资料附件
  input: media/files
  output: media/files
  extensions:
  - pdf
  - doc
  - docx
  - ppt
  - pptx
  - xls
  - xlsx
  - zip
  rename: safe
- name: videos
  label: 短视频
  input: media/videos
  output: media/videos
  extensions:
  - mp4
  - webm
  rename: safe
content:
- name: v2_settings
  label: 第二版｜首页与展示设置
  type: file
  path: versions/v2/data/settings.json
  format: json
  fields:
  - name: demoMode
    label: 显示多数据排版演示
    type: boolean
    description: 开启后使用演示介绍和演示记录；关闭并保存后恢复正式资料。演示内容不代表真实团队资料。
  - name: showPersonalProfile
    label: 展示本仓库个人资料副本
    type: boolean
    description: 仅使用本仓库保存的副本，不会读取或修改第一版网站。当前关闭，成员请在团队成员栏目填写。
  - name: showSharedResearch
    label: 展示本仓库保存的个人成果副本
    type: boolean
    description: 副本在拆分时保存，此后与第一版各自维护，不会同步。当前关闭。
  - name: school
    label: 学校
    type: string
  - name: college
    label: 学院
    type: string
  - name: teamName
    label: 团队名称
    type: string
  - name: labIntro
    label: 实验室简介
    type: text
  - name: contactAddress
    label: 团队联系地址
    type: string
  - name: contactPhone
    label: 团队联系电话
    type: string
  - name: contactEmail
    label: 团队联系邮箱
    type: string
  - name: admissionLinks
    label: 学校招生链接
    type: object
    list: true
    fields:
    - name: label
      label: 链接名称
      type: string
    - name: url
      label: 网址
      type: string
  - name: teacherHomepage
    label: 教师主页网址
    type: string
  - name: admissionNote
    label: 招生补充说明（经核实后填写）
    type: text
  - name: pageSize
    label: 每页条数
    type: select
    options:
      values:
      - name: '10'
        label: 10条
      - name: '20'
        label: 20条
      - name: '50'
        label: 50条
  - name: slides
    label: 首页横图
    type: object
    list:
      collapsible: true
    fields:
    - name: id
      label: 图片标识
      type: string
    - name: image
      label: 横图
      type: image
      options:
        media: images
    - name: caption
      label: 说明
      type: string
    - name: order
      label: 排列序号
      type: number
    - name: published
      label: 显示
      type: boolean
    - name: imageFit
      label: 照片显示方式
      type: select
      options:
        values:
        - name: contain
          label: 完整显示（适合团队合照）
        - name: cover
          label: 铺满横幅（可能裁切）
    - name: focusX
      label: 横向显示位置（0左，50中，100右）
      type: number
      default: 50
      options:
        min: 0
        max: 100
    - name: focusY
      label: 纵向显示位置（0上，50中，100下）
      type: number
      default: 50
      options:
        min: 0
        max: 100
    - name: layoutDemo
      label: 排版演示图片
      type: boolean
      default: false
      description: 开启时随多数据演示开关显示；换成正式团队照片后关闭此项。
  - name: researchAreas
    label: 团队研究方向（未填写时留空）
    type: object
    list: true
    fields:
    - name: title
      label: 方向名称
      type: string
    - name: description
      label: 研究介绍
      type: text
    - name: body
      label: 详细研究介绍
      type: text
    - name: participants
      label: 参与成员
      type: text
  - name: admissionsIntro
    label: 团队招生与培养说明
    type: text
  - name: admissionContacts
    label: 招生联系导师
    type: object
    list: true
    fields:
    - name: name
      label: 姓名
      type: string
    - name: description
      label: 方向与培养说明
      type: text
    - name: email
      label: 邮箱
      type: string
  - name: autoPlay
    label: 首页图片自动轮换
    type: boolean
    default: true
  - name: slideIntervalSeconds
    label: 每张图片停留时间（秒）
    type: number
    default: 2
    options:
      min: 2
      max: 15
  - name: previewPlaceholders
    label: 显示待补充的教师与新闻样本位置
    type: boolean
    description: 仅用于查看排版；不是实际成员或新闻。有真实新闻后自动显示真实内容。
    default: false
- name: v2_news
  label: 第二版｜新闻
  type: collection
  path: versions/v2/content/news
  format: json
  filename:
    template: '{year}{month}{day}{hour}{minute}{second}-{primary}.json'
    field: create
  subfolders: false
  view:
    fields:
    - title
    - published
    - order
    primary: title
    sort:
    - order
    - title
    default:
      sort: order
      order: asc
  fields:
  - name: title
    label: 新闻标题
    type: string
    required: true
  - name: date
    label: 日期
    type: date
    options:
      format: yyyy-MM-dd
  - name: summary
    label: 摘要
    type: text
  - name: body
    label: 正文
    type: text
    description: 支持多段文字；配图、视频和附件在下方单独添加。
  - name: cover
    label: 列表封面（留空使用第一张配图）
    type: image
    options:
      media: images
  - name: pinned
    label: 置顶
    type: boolean
  - name: images
    label: 配图
    type: image
    list: true
    options:
      media: images
  - name: attachment
    label: 资料附件
    type: file
    options:
      media: files
  - name: video
    label: 上传短视频
    type: file
    options:
      media: videos
    description: 试验约定单个不超过20 MB；长视频请填写播放链接。
  - name: videoUrl
    label: 视频播放链接
    type: string
    description: 可填写 https 视频文件或视频平台页面网址。
  - name: poster
    label: 视频封面
    type: image
    options:
      media: images
  - name: published
    label: 在网站显示
    type: boolean
    description: 只控制第二版显示，不改变第一版。
  - name: order
    label: 排列序号
    type: number
    description: 数字越小越靠前；同序号的新闻按日期从新到旧排列。
    options:
      min: 0
  - name: layoutDemo
    label: 排版演示记录
    type: boolean
    default: false
    description: 演示开关关闭后隐藏此记录。正式资料请新增记录并保持此项关闭。
  exclude:
  - .gitkeep
- name: v2_members
  label: 第二版｜团队成员
  type: collection
  path: versions/v2/content/members
  format: json
  filename:
    template: '{year}{month}{day}{hour}{minute}{second}-{primary}.json'
    field: create
  subfolders: false
  view:
    fields:
    - name
    - published
    - order
    primary: name
    sort:
    - order
    - name
    default:
      sort: order
      order: asc
  fields:
  - name: name
    label: 姓名
    type: string
    required: true
  - name: role
    label: 职务或身份
    type: string
  - name: type
    label: 成员类别
    type: select
    options:
      values:
      - name: teacher
        label: 教师
      - name: student
        label: 学生
  - name: photo
    label: 成员照片（不上传时使用默认头像）
    type: image
    options:
      media: images
  - name: bio
    label: 简介
    type: text
  - name: body
    label: 详细个人介绍
    type: text
  - name: demo
    label: 试验用示例成员
    type: boolean
    description: 打开后网站会标注示例成员；正式资料请关闭。
  - name: email
    label: 邮箱
    type: string
  - name: link
    label: 个人主页链接
    type: string
  - name: published
    label: 在网站显示
    type: boolean
    description: 只控制第二版显示，不改变第一版。
  - name: order
    label: 排列序号
    type: number
    description: 数字越小越靠前；同序号的新闻按日期从新到旧排列。
    options:
      min: 0
  - name: layoutDemo
    label: 排版演示记录
    type: boolean
    default: false
    description: 演示开关关闭后隐藏此记录。正式资料请新增记录并保持此项关闭。
  exclude:
  - .gitkeep
- name: v2_resources
