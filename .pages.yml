  - name: contributors
    label: 参与成员或负责人
    type: string
  - name: memberRefs
    label: 关联成员（可选）
    type: reference
    options:
      collection: v2_members
      multiple: true
      search: name,role
      value: '{path}'
      label: '{name}'
    description: 选择参与老师或学生；教师章节选自动列出成果后，会显示这条记录。参与成员文字仍可作为补充说明。
  - name: content
    label: 详细介绍与配图（可不填）
    type: block
    list: true
    blockKey: type
    description: 添加文字、图片、视频或附件。使用每段的移动按钮调整上下顺序；只填需要的段。
    blocks:
    - name: text
      label: 文字段
      fields:
      - name: heading
        label: 段落小标题（可不填）
        type: string
      - name: text
        label: 文字内容
        type: rich-text
        options:
          format: html
          media: images
          switcher: false
    - name: image
      label: 图片段
      fields:
      - name: image
        label: 选择或上传图片
        type: image
        options:
          media: images
      - name: caption
        label: 图片下方说明（可不填）
        type: string
      - name: alt
        label: 图片内容描述（便于无障碍阅读，可不填）
        type: string
      - name: width
        label: 显示宽度
        type: select
        options:
          values:
          - name: standard
            label: 适中，保持原图比例
          - name: wide
            label: 较宽，不超过正文宽度
        default: standard
    - name: video
      label: 视频段
      fields:
      - name: video
        label: 上传短视频（与播放网址二选一）
        type: file
        options:
          media: videos
        description: mp4或webm，当前单个不超过20 MB；长视频优先使用播放网址。
      - name: url
        label: 视频播放网址（已上传视频时留空）
        type: string
      - name: poster
        label: 视频封面（可不填）
        type: image
        options:
          media: images
      - name: caption
        label: 视频说明（可不填）
        type: string
      - name: label
        label: 外部视频链接文字（可不填）
        type: string
    - name: file
      label: 附件段
      fields:
      - name: file
        label: 选择或上传附件
        type: file
        options:
          media: files
      - name: label
        label: 页面上显示的附件名称
        type: string
        description: 例如：2026年招生申请材料.pdf。留空时显示实际文件名。
  exclude:
  - .gitkeep
- name: v2_resources
  label: 学术资源
  type: collection
  path: versions/v2/content/resources
  format: json
  filename:
    template: '{year}{month}{day}{hour}{minute}{second}-{primary}.json'
    field: create
  subfolders: false
  view:
    fields:
    - title
    - published
    - order
    primary: title
    sort:
    - order
    - title
    default:
      sort: order
      order: asc
  fields:
  - name: title
    label: 资料标题
    type: string
    required: true
  - name: content
    label: 正文内容（按这里的顺序显示）
    type: block
    list: true
    blockKey: type
    description: 添加文字、图片、视频或附件。使用每段的移动按钮调整上下顺序；只填需要的段。
    blocks:
    - name: text
      label: 文字段
