  - name: layoutDemo
    label: 排版演示记录
    type: boolean
    default: false
    description: 演示开关关闭后隐藏此记录。正式资料请新增记录并保持此项关闭。
  exclude:
  - .gitkeep
- name: v2_overrides
  label: 第二版｜本仓库成果副本展示调整
  type: collection
  path: versions/v2/content/overrides
  format: json
  filename:
    template: '{year}{month}{day}{hour}{minute}{second}-{primary}.json'
    field: create
  subfolders: false
  view:
    fields:
    - title
    - published
    - order
    primary: title
    sort:
    - order
    - title
    default:
      sort: order
      order: asc
  fields:
  - name: title
    label: 后台备注标题
    type: string
    required: true
  - name: collection
    label: 成果类型
    type: select
    options:
      values:
      - name: projects
        label: 科研项目
      - name: papers
        label: 论文
      - name: patents
        label: 专利
      - name: books
        label: 著作
      - name: awards
        label: 荣誉
  - name: recordId
    label: 原记录ID
    type: string
    required: true
    description: 填写原文件名去掉.json，例如projects-001；一条成果只能有一条覆盖配置。
  - name: body
    label: 第二版补充正文
    type: text
  - name: summary
    label: 第二版摘要
    type: text
  - name: hidden
    label: 在第二版隐藏这条成果
    type: boolean
  - name: showOnHome
    label: 首页展示（仅项目）
    type: boolean
    default: true
  - name: images
    label: 配图
    type: image
    list: true
    options:
      media: images
  - name: attachment
    label: 资料附件
    type: file
    options:
      media: files
  - name: video
    label: 上传短视频
    type: file
    options:
