  - name: poster
    label: 视频封面
    type: image
    options:
      media: images
    hidden: true
  - name: pinned
    label: 置顶（优先于日期）
    type: boolean
    default: false
    description: 需要排在普通条目前面才开启；多个置顶内容可在下面用1、2、3排列。
  - name: published
    label: 在网站显示
    type: boolean
    description: 开启表示这条资料可在网页显示；关闭则隐藏。保存后先在预览中检查，只有正式发布后访客才看到修改。
  - name: order
    label: 置顶内容之间的序号（可不填）
    type: number
    description: 只对开启置顶的内容生效，数字小的靠前，填1、2、3即可。普通内容不必填，自动按日期或年份从新到旧。
    options:
      min: 0
  exclude:
  - .gitkeep
  description: 在网页独立栏目“学术资源”显示。用于论文阅读指南、期刊分区、研究方法、工具和学习资料；不是重复录入团队发表论文的地方。 填写后先点 Save 保存，再点“生成已保存草稿预览”，打开 https://statfuture.github.io/hao-team/preview/
    检查；保存不会直接改变正式网站。
  actions:
  - name: build-draft-preview
    label: 生成已保存草稿预览
    workflow: pages.yml
    ref: main
    confirm: *id001
    scope: entry
- name: v2_admissions
  label: 招生信息
  type: file
  path: versions/v2/data/admissions.json
  format: json
  fields:
  - name: intro
    label: 招生概况（不使用混排时填写）
    type: text
  - name: content
    label: 招生正文（申请要求、培养介绍、图片和附件）
    type: block
    list:
      collapsible:
        summary: '{index} · {heading}{caption}{label}'
    blockKey: type
    description: 按从上到下显示；拖动左侧六点可换顺序，右侧垃圾桶可删除。空白段不显示。
    blocks:
    - name: text
      label: 文字段
      fields:
      - name: heading
        label: 段落小标题（可不填）
        type: string
      - name: text
        label: 文字内容
        type: rich-text
        options:
          format: html
          media: images
          switcher: false
    - name: image
      label: 图片段
      fields:
      - name: image
        label: 选择或上传图片
        type: image
        options:
          media: images
      - name: caption
        label: 图片下方说明（可不填）
        type: string
      - name: alt
        label: 图片内容描述（便于无障碍阅读，可不填）
        type: string
      - name: width
        label: 显示宽度
        type: select
        options:
          values:
          - name: standard
            label: 适中，保持原图比例
          - name: wide
            label: 较宽，不超过正文宽度
        default: standard
    - name: video
      label: 视频段
      fields:
      - name: video
        label: 上传短视频（与播放网址二选一）
        type: file
        options:
          media: videos
        description: mp4或webm，当前单个不超过20 MB；长视频优先使用播放网址。
      - name: url
        label: 视频播放网址（已上传视频时留空）
        type: string
      - name: poster
        label: 视频封面（可不填）
        type: image
        options:
          media: images
      - name: caption
        label: 视频说明（可不填）
        type: string
      - name: label
        label: 外部视频链接文字（可不填）
        type: string
    - name: file
      label: 附件段
      fields:
      - name: file
        label: 选择或上传附件
        type: file
        options:
          media: files
      - name: label
        label: 页面上显示的附件名称
        type: string
        description: 例如：2026年招生申请材料.pdf。留空时显示实际文件名。
      - name: description
        label: 附件说明（可不填）
        type: text
        description: 写资料用途、阅读提示或版本信息，显示在下载链接下方；留空时不显示。
  - name: contacts
    label: 招生联系人
    type: object
    list: true
    fields:
    - name: name
      label: 姓名
      type: string
    - name: description
      label: 招生方向或说明
      type: text
    - name: email
      label: 联系邮箱
      type: string
  - name: links
    label: 学校官方招生链接
    type: object
    list: true
    fields:
    - name: label
      label: 链接名称
      type: string
    - name: url
      label: 完整网址
      type: string
  - name: note
    label: 补充说明
    type: text
  description: 在网页“招生信息”显示团队招生说明、联系人及官方链接。 填写后先点 Save 保存，再点“生成已保存草稿预览”，打开 https://statfuture.github.io/hao-team/preview/
    检查；保存不会直接改变正式网站。
  actions:
  - name: build-draft-preview
    label: 生成已保存草稿预览
    workflow: pages.yml
    ref: main
    confirm: *id001
actions:
- name: build-draft-preview
  label: 生成已保存草稿预览
  workflow: pages.yml
  ref: main
  confirm: *id001
- name: publish-reviewed-drafts
  label: 发布正式网站
  workflow: publish-drafts.yml
  ref: main
  confirm:
    title: 发布全部已保存草稿？
    message: 此操作会把 drafts 中全部已保存的修改发布到正式网站，包括其他维护人的草稿。请先查看预览，并确认大家的资料都可以公开。预览尚未更新时会阻止发布。
    button: 确认发布全部草稿
settings:
  content:
    merge: true
