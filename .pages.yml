    label: 视频封面
    type: image
    options:
      media: images
  - name: published
    label: 启用这条覆盖配置
    type: boolean
    description: 启用后仅改变第二版的这条成果；原始记录和第一版不受影响。
  - name: order
    label: 排列序号
    type: number
    description: 数字越小越靠前；同序号的新闻按日期从新到旧排列。
    options:
