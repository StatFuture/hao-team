  fields:
  - name: title
    label: 资料标题
    type: string
    required: true
  - name: body
    label: 说明
    type: text
  - name: target
    label: 放置栏目
    type: select
    options:
      values:
      - name: resources
        label: 学术资源列表
      - name: home
        label: 首页
      - name: lab
        label: 实验室简介
      - name: news
        label: 团队新闻
      - name: team
        label: 学术团队
      - name: research
        label: 科学研究
      - name: admissions
        label: 招生信息
  - name: position
    label: 栏目中的位置
    type: select
    options:
      values:
      - name: before
        label: 内容之前
      - name: after
        label: 内容之后
  - name: images
    label: 配图
    type: image
    list: true
    options:
      media: images
  - name: attachment
    label: 资料附件
    type: file
    options:
