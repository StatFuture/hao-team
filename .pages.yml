media:
- name: images
  label: 图片
  input: media/images
  output: media/images
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  rename: safe
- name: files
  label: 资料附件
  input: media/files
  output: media/files
  extensions:
  - pdf
  - doc
  - docx
  - ppt
  - pptx
  - xls
  - xlsx
  - zip
  rename: safe
- name: videos
  label: 短视频
  input: media/videos
  output: media/videos
  extensions:
  - mp4
  - webm
  rename: safe
content:
- name: v2_settings
  label: 网站与首页设置
  type: file
  path: versions/v2/data/settings.json
  format: json
  fields:
  - name: demoMode
    label: 显示排版演示资料（练习期间保留）
    type: boolean
    description: 目前保持开启。演示新闻、成员、项目和校园试验轮播不是真实团队资料，练习结束后统一清理。
  - name: showPersonalProfile
    label: 展示本仓库个人资料副本
    type: boolean
    description: 仅使用本仓库保存的副本，不会读取或修改第一版网站。当前关闭，成员请在团队成员栏目填写。
    hidden: true
  - name: showSharedResearch
    label: 展示本仓库保存的个人成果副本
    type: boolean
    description: 副本在拆分时保存，此后与第一版各自维护，不会同步。当前关闭。
    hidden: true
  - name: school
    label: 学校
    type: string
  - name: college
    label: 学院
    type: string
  - name: teamName
    label: 团队名称
    type: string
  - name: contactAddress
    label: 团队联系地址
    type: string
  - name: contactPhone
    label: 团队联系电话
    type: string
  - name: contactEmail
    label: 团队联系邮箱
    type: string
  - name: pageSize
    label: 每页条数
    type: select
    options:
      values:
      - name: '10'
        label: 10条
      - name: '20'
        label: 20条
      - name: '50'
        label: 50条
  - name: slides
    label: 首页横图
    type: object
    list:
      collapsible: true
    fields:
    - name: id
      label: 图片标识
      type: string
    - name: image
      label: 横图
      type: image
      options:
        media: images
    - name: caption
      label: 说明
      type: string
    - name: order
      label: 排列序号
      type: number
    - name: published
      label: 显示
      type: boolean
    - name: imageFit
      label: 照片显示方式
      type: select
      options:
        values:
        - name: contain
          label: 完整显示（适合团队合照）
        - name: cover
          label: 铺满横幅（可能裁切）
    - name: focusX
      label: 横向显示位置（0左，50中，100右）
      type: number
      default: 50
      options:
        min: 0
        max: 100
    - name: focusY
      label: 纵向显示位置（0上，50中，100下）
      type: number
      default: 50
      options:
        min: 0
        max: 100
    - name: layoutDemo
      label: 排版演示图片
      type: boolean
      default: false
      description: 开启时随多数据演示开关显示；换成正式团队照片后关闭此项。
    description: 这里的照片用于首页轮播；文章配图应在对应文章正文中添加。多张照片按序号排列，自动与手动切换均保留。
  - name: autoPlay
    label: 首页图片自动轮换
    type: boolean
    default: true
  - name: slideIntervalSeconds
    label: 每张图片停留时间（秒）
    type: number
    default: 2
    options:
      min: 2
      max: 15
  - name: previewPlaceholders
    label: 显示待补充的教师与新闻样本位置
    type: boolean
    description: 仅用于查看排版；不是实际成员或新闻。有真实新闻后自动显示真实内容。
    default: false
- name: v2_lab
  label: 实验室简介
  type: file
  path: versions/v2/data/lab.json
  format: json
  fields:
  - name: intro
    label: 简介文字（不使用混排时填写）
    type: text
    description: 填写团队成立背景、研究领域和团队概况，不要写个人履历。
  - name: content
    label: 正文内容（按这里的顺序显示）
    type: block
    list: true
    blockKey: type
    description: 添加文字、图片、视频或附件。使用每段的移动按钮调整上下顺序；只填需要的段。
    blocks:
    - name: text
      label: 文字段
      fields:
      - name: heading
        label: 段落小标题（可不填）
        type: string
      - name: text
        label: 文字内容
        type: rich-text
        options:
          format: html
          media: images
          switcher: false
    - name: image
      label: 图片段
      fields:
      - name: image
        label: 选择或上传图片
        type: image
        options:
          media: images
      - name: caption
        label: 图片下方说明（可不填）
        type: string
      - name: alt
        label: 图片内容描述（便于无障碍阅读，可不填）
        type: string
      - name: width
        label: 显示宽度
        type: select
        options:
          values:
          - name: standard
            label: 适中，保持原图比例
          - name: wide
            label: 较宽，不超过正文宽度
        default: standard
    - name: video
      label: 视频段
      fields:
      - name: video
        label: 上传短视频（与播放网址二选一）
        type: file
        options:
          media: videos
        description: mp4或webm，当前单个不超过20 MB；长视频优先使用播放网址。
      - name: url
        label: 视频播放网址（已上传视频时留空）
        type: string
      - name: poster
        label: 视频封面（可不填）
        type: image
        options:
          media: images
      - name: caption
        label: 视频说明（可不填）
        type: string
      - name: label
        label: 外部视频链接文字（可不填）
        type: string
    - name: file
      label: 附件段
      fields:
      - name: file
        label: 选择或上传附件
        type: file
        options:
          media: files
      - name: label
        label: 页面上显示的附件名称
        type: string
        description: 例如：2026年招生申请材料.pdf。留空时显示实际文件名。
  - &id001
    name: layoutDemo
    label: 属于排版演示资料
    type: boolean
    default: false
    description: 目前练习期间保留；关闭网站演示开关后，这些记录不会显示。真实资料保持关闭。
- name: v2_news
  label: 团队新闻
  type: collection
  path: versions/v2/content/news
  format: json
  filename:
    template: '{year}{month}{day}{hour}{minute}{second}-{primary}.json'
    field: create
  subfolders: false
  view:
    fields:
    - title
    - date
    - pinned
    - published
    primary: title
    sort:
    - date
    - pinned
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: 新闻标题
    type: string
    required: true
    description: 填写真实新闻标题；操作练习请以【操作测试】开头。
  - name: date
    label: 日期
    type: date
    options:
      format: yyyy-MM-dd
    required: true
    description: 填写活动或新闻的实际日期；普通新闻按日期从新到旧显示。
  - name: summary
    label: 摘要
    type: text
    description: 只用于新闻列表，建议一两句话；详情正文不用再重复粘贴摘要。
  - name: content
    label: 正文内容（按这里的顺序显示）
    type: block
    list: true
    blockKey: type
    description: 新增时提供“介绍文字→图片→过程文字→视频→总结文字→附件”的空白模板。只是起点：每段可移动、删除或继续添加，空白段不会在网页显示。
    blocks:
    - name: text
      label: 文字段
      fields:
      - name: heading
        label: 段落小标题（可不填）
        type: string
      - name: text
        label: 文字内容
        type: rich-text
        options:
          format: html
          media: images
          switcher: false
    - name: image
      label: 图片段
      fields:
      - name: image
        label: 选择或上传图片
        type: image
        options:
          media: images
      - name: caption
        label: 图片下方说明（可不填）
        type: string
      - name: alt
        label: 图片内容描述（便于无障碍阅读，可不填）
        type: string
      - name: width
        label: 显示宽度
        type: select
        options:
          values:
          - name: standard
            label: 适中，保持原图比例
          - name: wide
            label: 较宽，不超过正文宽度
        default: standard
    - name: video
      label: 视频段
      fields:
      - name: video
        label: 上传短视频（与播放网址二选一）
        type: file
        options:
          media: videos
        description: mp4或webm，当前单个不超过20 MB；长视频优先使用播放网址。
      - name: url
        label: 视频播放网址（已上传视频时留空）
        type: string
      - name: poster
        label: 视频封面（可不填）
        type: image
        options:
          media: images
      - name: caption
        label: 视频说明（可不填）
        type: string
      - name: label
        label: 外部视频链接文字（可不填）
        type: string
    - name: file
      label: 附件段
      fields:
      - name: file
        label: 选择或上传附件
        type: file
        options:
          media: files
      - name: label
        label: 页面上显示的附件名称
        type: string
        description: 例如：2026年招生申请材料.pdf。留空时显示实际文件名。
    default:
    - type: text
      heading: 活动介绍
      text: ''
    - type: image
      image: ''
      caption: ''
    - type: text
      heading: 活动过程
      text: ''
    - type: video
      video: ''
      url: ''
    - type: text
      heading: 活动总结
      text: ''
    - type: file
      file: ''
      label: ''
  - name: body
    label: 正文
    type: text
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
    hidden: true
  - name: cover
    label: 列表封面（留空使用第一张配图）
    type: image
    options:
      media: images
    description: 只控制新闻列表缩略图，不会在正文重复插入；留空时取正文第一张图片。
  - name: pinned
    label: 置顶（优先于日期）
    type: boolean
    description: 只给重要通知开启。置顶新闻排在所有普通新闻之前。
  - name: images
    label: 配图
    type: image
    list: true
    options:
      media: images
    hidden: true
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
  - name: attachment
    label: 资料附件
    type: file
    options:
      media: files
    hidden: true
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
  - name: video
    label: 上传短视频
    type: file
    options:
      media: videos
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
    hidden: true
  - name: videoUrl
    label: 视频播放链接
    type: string
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
    hidden: true
  - name: poster
    label: 视频封面
    type: image
    options:
      media: images
    hidden: true
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
  - name: published
    label: 在网站显示
    type: boolean
    description: 关闭为草稿。保存后等待发布完成，再刷新网站检查。关闭显示不等于文件保密。
    default: false
  - name: order
    label: 置顶新闻之间的序号
    type: number
    description: 只对置顶新闻生效；普通新闻不必填写，按日期排序。
    options:
      min: 0
  - name: layoutDemo
    label: 排版演示记录
    type: boolean
    default: false
    description: 演示开关关闭后隐藏此记录。正式资料请新增记录并保持此项关闭。
  exclude:
  - .gitkeep
- name: v2_members
  label: 团队成员
  type: collection
  path: versions/v2/content/members
  format: json
  filename:
    template: '{year}{month}{day}{hour}{minute}{second}-{primary}.json'
    field: create
  subfolders: false
  view:
    fields:
    - name
    - type
    - role
    - published
    - order
    primary: name
    sort:
    - order
    - name
    default:
      sort: order
      order: asc
  fields:
  - name: name
    label: 姓名
    type: string
    required: true
  - name: role
    label: 职务或身份
    type: string
    description: 例如教授、副教授、硕士研究生。不要在这里写教育经历。
  - name: type
    label: 成员类别
    type: select
    options:
      values:
      - name: teacher
        label: 教师
      - name: student
        label: 学生
    required: true
    description: 必须单独选择教师或学生，不能仅在职务中写学生。
  - name: photo
    label: 成员照片（不上传时使用默认头像）
    type: image
    options:
      media: images
  - name: mentor
    label: 导师身份（学生可不填）
    type: string
    description: 例如硕士生导师、博士生导师。
  - name: researchFocus
    label: 研究方向
    type: text
  - name: office
    label: 办公地点（可不填）
    type: string
  - name: bio
    label: 列表卡片简介
    type: text
    description: 建议50至100字。完整介绍写到下方教师／学生章节中。
  - name: sections
    label: 个人介绍章节（按这里的顺序显示）
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    description: 每个章节单独添加。可以上下移动章节，未填写的章节不显示。教师可参考个人简介、教育背景、工作经历、科研项目、代表论文、荣誉、教学与招生。学生只填适用内容。
    fields:
    - name: title
      label: 章节标题
      type: string
      required: true
    - name: kind
      label: 内容来源
      type: select
      options:
        values:
        - name: content
          label: 手动编辑文字、图片等
        - name: projects
          label: 自动列出关联到本人的团队项目
        - name: papers
          label: 自动列出关联到本人的团队论文
        - name: awards
          label: 自动列出关联到本人的团队荣誉
      default: content
    - name: content
      label: 本章节内容（自动列出成果时不用填写）
      type: block
      list: true
      blockKey: type
      description: 添加文字、图片、视频或附件。使用每段的移动按钮调整上下顺序；只填需要的段。
      blocks:
      - name: text
        label: 文字段
        fields:
        - name: heading
          label: 段落小标题（可不填）
          type: string
        - name: text
          label: 文字内容
          type: rich-text
          options:
            format: html
            media: images
            switcher: false
      - name: image
        label: 图片段
        fields:
        - name: image
          label: 选择或上传图片
          type: image
          options:
            media: images
        - name: caption
          label: 图片下方说明（可不填）
          type: string
        - name: alt
          label: 图片内容描述（便于无障碍阅读，可不填）
          type: string
        - name: width
          label: 显示宽度
          type: select
          options:
            values:
            - name: standard
              label: 适中，保持原图比例
            - name: wide
              label: 较宽，不超过正文宽度
          default: standard
      - name: video
        label: 视频段
        fields:
        - name: video
          label: 上传短视频（与播放网址二选一）
          type: file
          options:
            media: videos
          description: mp4或webm，当前单个不超过20 MB；长视频优先使用播放网址。
        - name: url
          label: 视频播放网址（已上传视频时留空）
          type: string
        - name: poster
          label: 视频封面（可不填）
          type: image
          options:
            media: images
        - name: caption
          label: 视频说明（可不填）
          type: string
        - name: label
          label: 外部视频链接文字（可不填）
          type: string
      - name: file
        label: 附件段
        fields:
        - name: file
          label: 选择或上传附件
          type: file
          options:
            media: files
        - name: label
          label: 页面上显示的附件名称
          type: string
          description: 例如：2026年招生申请材料.pdf。留空时显示实际文件名。
    default:
    - title: 个人简介
      kind: content
      content:
      - type: text
        text: ''
    - title: 教育背景
      kind: content
      content:
      - type: text
        text: ''
    - title: 工作经历
      kind: content
      content:
      - type: text
        text: ''
    - title: 科研项目
      kind: projects
      content: []
    - title: 代表性学术论文
      kind: papers
      content: []
    - title: 荣誉奖励
      kind: awards
      content: []
    - title: 教学与招生
      kind: content
      content:
      - type: text
        text: ''
  - name: body
    label: 详细个人介绍
    type: text
    hidden: true
  - name: demo
    label: 试验用示例成员
    type: boolean
    description: 打开后网站会标注示例成员；正式资料请关闭。
  - name: email
    label: 邮箱
    type: string
  - name: link
    label: 个人主页链接
    type: string
  - name: published
    label: 在网站显示
    type: boolean
    description: 关闭为草稿。保存后等待发布完成，再刷新网站检查。关闭显示不等于文件保密。
    default: false
  - name: order
    label: 排列序号
    type: number
    description: 数字越小越靠前；同序号的新闻按日期从新到旧排列。
    options:
      min: 0
  - name: layoutDemo
    label: 排版演示记录
    type: boolean
    default: false
    description: 演示开关关闭后隐藏此记录。正式资料请新增记录并保持此项关闭。
  exclude:
  - .gitkeep
- name: v2_directions
  label: 研究方向
  type: collection
  path: versions/v2/content/directions
  format: json
  fields:
  - name: title
    label: 研究方向名称
    type: string
    required: true
  - name: description
    label: 首页／列表用的简短介绍
    type: text
  - name: participants
    label: 参与教师与团队说明
    type: text
  - name: content
    label: 研究方向详细介绍
    type: block
    list: true
    blockKey: type
    description: 添加文字、图片、视频或附件。使用每段的移动按钮调整上下顺序；只填需要的段。
    blocks:
    - name: text
      label: 文字段
      fields:
      - name: heading
        label: 段落小标题（可不填）
        type: string
      - name: text
        label: 文字内容
        type: rich-text
        options:
          format: html
          media: images
          switcher: false
    - name: image
      label: 图片段
      fields:
      - name: image
        label: 选择或上传图片
        type: image
        options:
          media: images
      - name: caption
        label: 图片下方说明（可不填）
        type: string
      - name: alt
        label: 图片内容描述（便于无障碍阅读，可不填）
        type: string
      - name: width
        label: 显示宽度
        type: select
        options:
          values:
          - name: standard
            label: 适中，保持原图比例
          - name: wide
            label: 较宽，不超过正文宽度
        default: standard
    - name: video
      label: 视频段
      fields:
