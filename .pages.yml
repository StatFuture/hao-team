media:
- name: images
  label: 图片
  input: media/images
  output: media/images
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  rename: safe
- name: files
  label: 资料附件
  input: media/files
  output: media/files
  extensions:
  - pdf
  - doc
  - docx
  - ppt
  - pptx
  - xls
  - xlsx
  - zip
  rename: safe
- name: videos
  label: 短视频
  input: media/videos
  output: media/videos
  extensions:
  - mp4
  - webm
  rename: safe
content:
- name: v2_settings
  label: 网站与首页设置
  type: file
  path: versions/v2/data/settings.json
  format: json
  fields:
  - name: showPersonalProfile
    label: 展示本仓库个人资料副本
    type: boolean
    description: 仅使用本仓库保存的副本，不会读取或修改第一版网站。当前关闭，成员请在团队成员栏目填写。
    hidden: true
  - name: showSharedResearch
    label: 展示本仓库保存的个人成果副本
    type: boolean
    description: 副本在拆分时保存，此后与第一版各自维护，不会同步。当前关闭。
    hidden: true
  - name: school
    label: 学校
    type: string
  - name: college
    label: 学院
    type: string
  - name: teamName
    label: 团队名称
    type: string
  - name: contactAddress
    label: 团队联系地址
    type: string
  - name: contactPhone
    label: 团队联系电话
    type: string
  - name: contactEmail
    label: 团队联系邮箱
    type: string
  - name: pageSize
    label: 每页条数
    type: select
    options:
      values:
      - name: '10'
        label: 10条
      - name: '20'
        label: 20条
      - name: '50'
        label: 50条
    description: 设置列表默认每页显示的数量，可选10、20或50。建议先用10，访客也能在列表中自行切换。
  - name: slides
    label: 首页横图
    type: object
    list:
      collapsible:
        summary: '{caption}'
    fields:
    - name: id
      label: 图片标识
      type: string
      hidden: true
      required: false
    - name: image
      label: 横图
      type: image
      options:
        media: images
    - name: caption
      label: 图片内容描述（不在图上显示）
      type: string
      description: 如“团队学术交流合照”。用于辨认图片及屏幕阅读器，不会作为轮播字幕显示。
    - name: order
      label: 排列序号
      type: number
      description: 数字小的先播放，填1、2、3即可。
    - name: published
      label: 显示
      type: boolean
    - name: imageFit
      label: 照片显示方式
      type: select
      options:
        values:
        - name: contain
          label: 完整显示（适合团队合照）
        - name: cover
          label: 铺满横幅（可能裁切）
      description: 照片统一居中。完整显示保留整张照片，可能留白；铺满横幅可能裁掉边缘。合照建议完整显示。
    description: 一项对应一张首页照片，按排列序号播放；可自动轮播，也可手动点箭头。照片统一居中。
  - name: autoPlay
    label: 首页图片自动轮换
    type: boolean
    default: true
  - name: slideIntervalSeconds
    label: 每张图片停留时间（秒）
    type: number
    default: 2
    options:
      min: 2
      max: 15
  description: 填写学校、团队名称、联系信息及首页轮播图片。轮播图片统一居中，图片描述不会显示为字幕。 填写后先点 Save 保存，再点“生成已保存草稿预览”，打开 https://statfuture.github.io/hao-team/preview/
    检查；保存不会直接改变正式网站。
  actions:
  - name: build-draft-preview
    label: 生成已保存草稿预览
    workflow: pages.yml
    ref: main
    confirm: &id001
      title: 生成草稿预览
      message: 请先在 drafts 草稿工作区保存。未保存的表单不会进入预览。生成完成后打开 https://statfuture.github.io/hao-team/preview/ 。此操作不发布正式内容。
      button: 生成预览
- name: v2_lab
  label: 实验室简介
  type: file
  path: versions/v2/data/lab.json
  format: json
  fields:
  - name: intro
    label: 简介文字（不使用混排时填写）
    type: text
    description: 填写团队成立背景、研究领域和团队概况，不要写个人履历。
  - name: content
    label: 正文内容（按这里的顺序显示）
    type: block
    list:
      collapsible:
        summary: '{index} · {heading}{caption}{label}'
    blockKey: type
    description: 按从上到下显示；拖动左侧六点可换顺序，右侧垃圾桶可删除。空白段不显示。
    blocks:
    - name: text
      label: 文字段
      fields:
      - name: heading
        label: 段落小标题（可不填）
        type: string
      - name: text
        label: 文字内容
        type: rich-text
        options:
          format: html
          media: images
          switcher: false
    - name: image
      label: 图片段
      fields:
      - name: image
        label: 选择或上传图片
        type: image
        options:
          media: images
      - name: caption
        label: 图片下方说明（可不填）
        type: string
      - name: alt
        label: 图片内容描述（便于无障碍阅读，可不填）
        type: string
      - name: width
        label: 显示宽度
        type: select
        options:
          values:
          - name: standard
            label: 适中，保持原图比例
          - name: wide
            label: 较宽，不超过正文宽度
        default: standard
    - name: video
      label: 视频段
      fields:
      - name: video
        label: 上传短视频（与播放网址二选一）
        type: file
        options:
          media: videos
        description: mp4或webm，当前单个不超过20 MB；长视频优先使用播放网址。
      - name: url
        label: 视频播放网址（已上传视频时留空）
        type: string
      - name: poster
        label: 视频封面（可不填）
        type: image
        options:
          media: images
      - name: caption
        label: 视频说明（可不填）
        type: string
      - name: label
        label: 外部视频链接文字（可不填）
        type: string
    - name: file
      label: 附件段
      fields:
      - name: file
        label: 选择或上传附件
        type: file
        options:
          media: files
      - name: label
        label: 页面上显示的附件名称
        type: string
        description: 例如：2026年招生申请材料.pdf。留空时显示实际文件名。
      - name: description
        label: 附件说明（可不填）
        type: text
        description: 写资料用途、阅读提示或版本信息，显示在下载链接下方；留空时不显示。
  description: 在网页“实验室简介”显示团队整体介绍。 填写后先点 Save 保存，再点“生成已保存草稿预览”，打开 https://statfuture.github.io/hao-team/preview/
    检查；保存不会直接改变正式网站。
  actions:
  - name: build-draft-preview
    label: 生成已保存草稿预览
    workflow: pages.yml
    ref: main
    confirm: *id001
- name: v2_news
  label: 团队新闻
  type: collection
  path: versions/v2/content/news
  format: json
  filename:
    template: '{year}{month}{day}{hour}{minute}{second}-{primary}.json'
    field: create
  subfolders: false
  view:
    fields:
    - title
    - date
    - pinned
    - published
    primary: title
    sort:
    - date
    - pinned
    - order
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: 新闻标题
    type: string
    required: true
    description: 填写真实新闻标题；操作练习请以【操作测试】开头。
  - name: date
    label: 日期
    type: date
    options:
      format: yyyy-MM-dd
    required: true
    description: 填写活动或新闻的实际日期；普通新闻按日期从新到旧显示。
  - name: summary
    label: 摘要
    type: text
    description: 只用于新闻列表，建议一两句话；详情正文不用再重复粘贴摘要。
  - name: content
    label: 正文内容（按这里的顺序显示）
    type: block
    list:
      default:
      - type: text
        heading: 活动介绍
        text: ''
      - type: image
        image: ''
        caption: ''
      - type: text
        heading: 活动过程
        text: ''
      - type: video
        video: ''
        url: ''
      - type: text
        heading: 活动总结
        text: ''
      - type: file
        file: ''
        label: ''
      collapsible:
        summary: '{index} · {heading}{caption}{label}'
    blockKey: type
    description: 按从上到下显示；拖动左侧六点可换顺序，右侧垃圾桶可删除。空白段不显示。
    blocks:
    - name: text
      label: 文字段
      fields:
      - name: heading
        label: 段落小标题（可不填）
        type: string
      - name: text
        label: 文字内容
        type: rich-text
        options:
          format: html
          media: images
          switcher: false
    - name: image
      label: 图片段
      fields:
      - name: image
        label: 选择或上传图片
        type: image
        options:
          media: images
      - name: caption
        label: 图片下方说明（可不填）
        type: string
      - name: alt
        label: 图片内容描述（便于无障碍阅读，可不填）
        type: string
      - name: width
        label: 显示宽度
        type: select
        options:
          values:
          - name: standard
            label: 适中，保持原图比例
          - name: wide
            label: 较宽，不超过正文宽度
        default: standard
    - name: video
      label: 视频段
      fields:
      - name: video
        label: 上传短视频（与播放网址二选一）
        type: file
        options:
          media: videos
        description: mp4或webm，当前单个不超过20 MB；长视频优先使用播放网址。
      - name: url
        label: 视频播放网址（已上传视频时留空）
        type: string
      - name: poster
        label: 视频封面（可不填）
        type: image
        options:
          media: images
      - name: caption
        label: 视频说明（可不填）
        type: string
      - name: label
        label: 外部视频链接文字（可不填）
        type: string
    - name: file
      label: 附件段
      fields:
      - name: file
        label: 选择或上传附件
        type: file
        options:
          media: files
      - name: label
        label: 页面上显示的附件名称
        type: string
        description: 例如：2026年招生申请材料.pdf。留空时显示实际文件名。
      - name: description
        label: 附件说明（可不填）
        type: text
        description: 写资料用途、阅读提示或版本信息，显示在下载链接下方；留空时不显示。
  - name: body
    label: 正文
    type: text
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
    hidden: true
  - name: cover
    label: 列表封面（留空使用第一张配图）
    type: image
    options:
      media: images
    description: 只控制新闻列表缩略图，不会在正文重复插入；留空时取正文第一张图片。
  - name: pinned
    label: 置顶（优先于日期）
    type: boolean
    description: 只给重要通知开启。置顶新闻排在所有普通新闻之前。
  - name: images
    label: 配图
    type: image
    list: true
    options:
      media: images
    hidden: true
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
  - name: attachment
    label: 资料附件
    type: file
    options:
      media: files
    hidden: true
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
  - name: video
    label: 上传短视频
    type: file
    options:
      media: videos
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
    hidden: true
  - name: videoUrl
    label: 视频播放链接
    type: string
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
    hidden: true
  - name: poster
    label: 视频封面
    type: image
    options:
      media: images
    hidden: true
    description: 旧版兼容资料，已保留。新内容请使用正文内容段编辑。
  - name: published
    label: 在网站显示
    type: boolean
    description: 开启表示这条资料可在网页显示；关闭则隐藏。保存后先在预览中检查，只有正式发布后访客才看到修改。
    default: false
  - name: order
    label: 置顶新闻之间的序号
    type: number
    description: 只对开启置顶的内容生效，数字小的靠前，填1、2、3即可。普通内容不必填，自动按日期或年份从新到旧。
    options:
      min: 0
  exclude:
  - .gitkeep
  description: 在网页“团队新闻”显示；点击新闻进入图文详情。普通新闻按日期从新到旧排列。 填写后先点 Save 保存，再点“生成已保存草稿预览”，打开 https://statfuture.github.io/hao-team/preview/
    检查；保存不会直接改变正式网站。
  actions:
  - name: build-draft-preview
    label: 生成已保存草稿预览
    workflow: pages.yml
    ref: main
    confirm: *id001
    scope: entry
- name: v2_members
  label: 团队成员
  type: collection
  path: versions/v2/content/members
  format: json
  filename:
    template: '{year}{month}{day}{hour}{minute}{second}-{primary}.json'
    field: create
  subfolders: false
  view:
    fields:
    - name
    - type
    - role
    - published
    - order
    primary: name
    sort:
    - order
    - name
    default:
      sort: order
      order: asc
  fields:
  - name: name
    label: 姓名
    type: string
    required: true
  - name: role
    label: 职务或身份
    type: string
    description: 例如教授、副教授、硕士研究生。不要在这里写教育经历。
  - name: type
    label: 成员类别
    type: select
    options:
      values:
      - name: teacher
        label: 教师
      - name: student
        label: 学生
    required: true
    description: 必须单独选择教师或学生，不能仅在职务中写学生。
  - name: photo
    label: 成员照片（不上传时使用默认头像）
    type: image
    options:
      media: images
    description: 留空时，成员列表和个人详情页自动显示蓝灰色人形占位图，不代表真人；后台上传框仍为空，不用另选默认图片。上传本人照片并保存后，会替换占位图。
  - name: mentor
    label: 导师身份（学生可不填）
    type: string
    description: 例如硕士生导师、博士生导师。
  - name: researchFocus
    label: 研究方向
    type: text
  - name: office
    label: 办公地点（可不填）
    type: string
  - name: bio
    label: 列表卡片简介
    type: text
    description: 建议50至100字。完整介绍写到下方教师／学生章节中。
  - name: sections
    label: 个人介绍（每项是个人页的一个小标题）
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
      default:
      - title: 个人简介
        kind: content
        content:
        - type: text
          text: ''
      - title: 教育背景
        kind: content
        content:
        - type: text
          text: ''
      - title: 工作经历
        kind: content
        content:
        - type: text
          text: ''
      - title: 科研项目
        kind: projects
        content: []
      - title: 代表性学术论文
        kind: papers
        content: []
      - title: 荣誉奖励
        kind: awards
        content: []
      - title: 教学与招生
        kind: content
        content:
        - type: text
          text: ''
    description: 点小标题左边的箭头展开，里面先填标题，再选“这一部分怎样填写”。可添加、删除及拖动排序；空内容不显示。
    fields:
    - name: title
      label: 章节标题
      type: string
      required: true
    - name: kind
      label: 介绍内容的填写方式
      type: select
      options:
        values:
        - name: content
          label: 在下面填写文字、图片等
        - name: projects
          label: 自动显示此人的科研项目
        - name: papers
          label: 自动显示此人的学术论文
        - name: patents
          label: 自动显示此人的专利
        - name: books
          label: 自动显示此人的著作与教材
        - name: awards
          label: 自动显示此人的荣誉奖励
      default: content
      description: 选“在下面填写文字、图片等”，就自己写这一章；选“自动显示此人的学术论文”等，网站就列出在相应成果库中关联了此人的资料，不用复制。仅在姓名文字里写人名不会建立关联。
    - name: content
      label: 这一部分的介绍内容（选自动显示时不用填）
      type: block
      list:
        collapsible:
          summary: '{index} · {heading}{caption}{label}'
      blockKey: type
      description: 按从上到下显示；拖动左侧六点可换顺序，右侧垃圾桶可删除。空白段不显示。
      blocks:
      - name: text
        label: 文字段
        fields:
        - name: heading
          label: 段落小标题（可不填）
          type: string
        - name: text
          label: 文字内容
          type: rich-text
          options:
            format: html
            media: images
            switcher: false
      - name: image
        label: 图片段
        fields:
        - name: image
          label: 选择或上传图片
          type: image
          options:
            media: images
        - name: caption
          label: 图片下方说明（可不填）
          type: string
        - name: alt
          label: 图片内容描述（便于无障碍阅读，可不填）
          type: string
        - name: width
          label: 显示宽度
          type: select
          options:
            values:
            - name: standard
              label: 适中，保持原图比例
            - name: wide
              label: 较宽，不超过正文宽度
          default: standard
      - name: video
        label: 视频段
        fields:
        - name: video
          label: 上传短视频（与播放网址二选一）
          type: file
          options:
            media: videos
          description: mp4或webm，当前单个不超过20 MB；长视频优先使用播放网址。
        - name: url
          label: 视频播放网址（已上传视频时留空）
          type: string
        - name: poster
          label: 视频封面（可不填）
          type: image
          options:
            media: images
        - name: caption
          label: 视频说明（可不填）
          type: string
        - name: label
          label: 外部视频链接文字（可不填）
          type: string
      - name: file
        label: 附件段
        fields:
        - name: file
          label: 选择或上传附件
          type: file
          options:
            media: files
        - name: label
          label: 页面上显示的附件名称
          type: string
          description: 例如：2026年招生申请材料.pdf。留空时显示实际文件名。
        - name: description
          label: 附件说明（可不填）
          type: text
          description: 写资料用途、阅读提示或版本信息，显示在下载链接下方；留空时不显示。
  - name: body
    label: 详细个人介绍
    type: text
    hidden: true
  - name: email
    label: 邮箱
    type: string
  - name: link
    label: 个人主页链接
    type: string
  - name: published
    label: 在网站显示
    type: boolean
