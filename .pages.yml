        label: 段落小标题（可不填）
        type: string
      - name: text
        label: 文字内容
        type: rich-text
        options:
          format: html
          media: images
          switcher: false
    - name: image
      label: 图片段
      fields:
      - name: image
        label: 选择或上传图片
        type: image
        options:
          media: images
      - name: caption
        label: 图片下方说明（可不填）
        type: string
      - name: alt
        label: 图片内容描述（便于无障碍阅读，可不填）
        type: string
      - name: width
        label: 显示宽度
        type: select
        options:
          values:
          - name: standard
            label: 适中，保持原图比例
          - name: wide
            label: 较宽，不超过正文宽度
        default: standard
    - name: video
      label: 视频段
      fields:
      - name: video
        label: 上传短视频（与播放网址二选一）
        type: file
        options:
          media: videos
        description: mp4或webm，当前单个不超过20 MB；长视频优先使用播放网址。
      - name: url
        label: 视频播放网址（已上传视频时留空）
        type: string
      - name: poster
        label: 视频封面（可不填）
        type: image
        options:
          media: images
      - name: caption
        label: 视频说明（可不填）
        type: string
      - name: label
        label: 外部视频链接文字（可不填）
        type: string
    - name: file
      label: 附件段
      fields:
      - name: file
        label: 选择或上传附件
        type: file
        options:
          media: files
      - name: label
        label: 页面上显示的附件名称
        type: string
        description: 例如：2026年招生申请材料.pdf。留空时显示实际文件名。
  - name: body
    label: 说明
    type: text
    hidden: true
  - name: target
    label: 放置栏目
    type: select
    options:
      values:
      - name: resources
        label: 学术资源列表
      - name: home
        label: 首页
      - name: lab
        label: 实验室简介
      - name: news
        label: 团队新闻
      - name: team
        label: 学术团队
      - name: research
        label: 科学研究
      - name: admissions
        label: 招生信息
    description: 通常选择学术资源；只有确实要附加到其他栏目时才更改。不会加入首页轮播。
  - name: position
    label: 栏目中的位置
    type: select
    options:
      values:
      - name: before
        label: 内容之前
      - name: after
        label: 内容之后
    description: 只控制整条资源放在栏目内容的前面或后面，不决定正文中图片的位置。正文位置由内容段顺序决定。
  - name: images
    label: 配图
    type: image
    list: true
    options:
      media: images
    hidden: true
  - name: attachment
    label: 资料附件
    type: file
    options:
      media: files
    hidden: true
  - name: video
    label: 上传短视频
    type: file
    options:
      media: videos
    description: 试验约定单个不超过20 MB；长视频请填写播放链接。
    hidden: true
  - name: videoUrl
    label: 视频播放链接
    type: string
    description: 可填写 https 视频文件或视频平台页面网址。
    hidden: true
  - name: poster
    label: 视频封面
    type: image
    options:
      media: images
    hidden: true
  - name: published
    label: 在网站显示
    type: boolean
    description: 只控制第二版显示，不改变第一版。
  - name: order
    label: 排列序号
    type: number
    description: 数字越小越靠前；同序号的新闻按日期从新到旧排列。
    options:
      min: 0
  - name: layoutDemo
    label: 排版演示记录
    type: boolean
    default: false
    description: 演示开关关闭后隐藏此记录。正式资料请新增记录并保持此项关闭。
  exclude:
  - .gitkeep
